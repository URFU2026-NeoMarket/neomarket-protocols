openapi: 3.1.0
info:
  title: NeoMarket Moderation
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновить токены
      operationId: refresh_api_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Выход
      operationId: logout_api_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/events/product:
    post:
      tags:
        - Events
      summary: Handle Product Event
      operationId: handle_product_event_api_v1_events_product_post
      parameters:
        - name: X-Service-Key
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            title: X-Service-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEventIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventProcessedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/product-moderation/get-next:
    post:
      tags:
        - Moderation
      summary: Get Next Card
      operationId: get_next_card_api_v1_product_moderation_get_next_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/GetNextRequest'
                - type: 'null'
              title: Data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModerationCard'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  '/api/v1/products/{product_id}/approve':
    post:
      tags:
        - Moderation
      summary: Approve Product
      operationId: approve_product_api_v1_products__product_id__approve_post
      security:
        - HTTPBearer: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  '/api/v1/products/{product_id}/decline':
    post:
      tags:
        - Moderation
      summary: Decline Product
      operationId: decline_product_api_v1_products__product_id__decline_post
      security:
        - HTTPBearer: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            title: Product Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products/:
    get:
      tags:
        - Moderation
      summary: Get All Products
      operationId: get_all_products_api_v1_products__get
      security:
        - HTTPBearer: []
      parameters:
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ModerationStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            title: Limit
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            title: Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModerationPaginatedResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/product-blocking-reasons:
    get:
      tags:
        - Moderation
      summary: Get Blocking Reasons
      operationId: get_blocking_reasons_api_v1_product_blocking_reasons_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BlockingReasonOut'
                type: array
                title: >-
                  Response Get Blocking Reasons Api V1 Product Blocking Reasons
                  Get
      security:
        - HTTPBearer: []
  /api/v1/admin/register:
    post:
      tags:
        - Admin
      summary: Регистрация модератора
      operationId: register_api_v1_admin_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeratorCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: []
  /api/v1/admin/moderators:
    get:
      tags:
        - Admin
      summary: Get Moderators
      operationId: get_moderators_api_v1_admin_moderators_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModeratorRead'
                type: array
                title: Response Get Moderators Api V1 Admin Moderators Get
      security:
        - HTTPBearer: []
  '/api/v1/admin/moderators/{moderator_id}/ban':
    post:
      tags:
        - Admin
      summary: Ban Moderator
      operationId: ban_moderator_api_v1_admin_moderators__moderator_id__ban_post
      security:
        - HTTPBearer: []
      parameters:
        - name: moderator_id
          in: path
          required: true
          schema:
            type: string
            title: Moderator Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApproveResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
        - status
      title: ApproveResponse
    BlockingHistory:
      properties:
        blocking_reason:
          anyOf:
            - $ref: '#/components/schemas/BlockingReasonOut'
            - type: 'null'
        field_reports:
          items:
            $ref: '#/components/schemas/FieldReportOut'
          type: array
          title: Field Reports
      type: object
      title: BlockingHistory
    BlockingReasonOut:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        hard_block:
          type: boolean
          title: Hard Block
      type: object
      required:
        - id
        - title
        - hard_block
      title: BlockingReasonOut
    DeclineRequest:
      properties:
        blocking_reason_id:
          type: string
          title: Blocking Reason Id
        moderator_comment:
          anyOf:
            - type: string
            - type: 'null'
          title: Moderator Comment
        field_reports:
          items:
            $ref: '#/components/schemas/FieldReportIn'
          type: array
          title: Field Reports
      type: object
      required:
        - blocking_reason_id
        - field_reports
      title: DeclineRequest
    DeclineResponse:
      properties:
        status:
          type: string
          title: Status
        hard_block:
          type: boolean
          title: Hard Block
      type: object
      required:
        - status
        - hard_block
      title: DeclineResponse
    EventProcessedResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
        - status
      title: EventProcessedResponse
    FieldReportIn:
      properties:
        field_name:
          type: string
          title: Field Name
        sku_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Sku Id
        comment:
          type: string
          title: Comment
      type: object
      required:
        - field_name
        - comment
      title: FieldReportIn
    FieldReportOut:
      properties:
        id:
          type: string
          title: Id
        field_name:
          type: string
          title: Field Name
        sku_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Sku Id
        comment:
          type: string
          title: Comment
      type: object
      required:
        - id
        - field_name
        - sku_id
        - comment
      title: FieldReportOut
    GetNextRequest:
      properties:
        queueId:
          anyOf:
            - type: integer
            - type: 'null'
          title: Queueid
      type: object
      title: GetNextRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
        - email
        - password
      title: LoginRequest
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: Bearer
        expires_in:
          type: integer
          title: Expires In
        user:
          $ref: '#/components/schemas/ModeratorRead'
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - user
      title: LoginResponse
    ModerationStatus:
      type: string
      enum:
        - CREATED
        - ON_MODERATION
        - BLOCKED
        - MODERATED
        - HARD_BLOCKED
        - DELETED
      title: ModerationStatus
    ModeratorCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      title: ModeratorCreate
    ModeratorRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          format: email
          title: Email
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        is_active:
          type: boolean
          title: Is Active
        is_admin:
          type: boolean
          title: Is Admin
      type: object
      required:
        - id
        - email
        - first_name
        - last_name
        - is_active
        - is_admin
      title: ModeratorRead
    ProductEventIn:
      properties:
        idempotency_key:
          type: string
          format: uuid
          title: Idempotency Key
        product_id:
          type: string
          format: uuid
          title: Product Id
        seller_id:
          type: string
          format: uuid
          title: Seller Id
        event:
          $ref: '#/components/schemas/ProductEventType'
        date:
          type: string
          format: date-time
          title: Date
      type: object
      required:
        - idempotency_key
        - product_id
        - seller_id
        - event
        - date
      title: ProductEventIn
    ProductEventType:
      type: string
      enum:
        - CREATED
        - EDITED
        - DELETED
      title: ProductEventType
    ProductModerationCard:
      properties:
        id:
          type: string
          title: Id
        product_id:
          type: string
          title: Product Id
        seller_id:
          type: string
          title: Seller Id
        status:
          type: string
          title: Status
        queue_priority:
          type: integer
          title: Queue Priority
        total_active_quantity:
          type: integer
          title: Total Active Quantity
        json_before:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Json Before
        json_after:
          additionalProperties: true
          type: object
          title: Json After
        blocking_reason_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Blocking Reason Id
        moderator_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Moderator Id
        moderator_comment:
          anyOf:
            - type: string
            - type: 'null'
          title: Moderator Comment
        date_created:
          type: string
          format: date-time
          title: Date Created
        date_updated:
          type: string
          format: date-time
          title: Date Updated
        date_moderation:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Date Moderation
        blocking_history:
          anyOf:
            - $ref: '#/components/schemas/BlockingHistory'
            - type: 'null'
      type: object
      required:
        - id
        - product_id
        - seller_id
        - status
        - queue_priority
        - total_active_quantity
        - json_before
        - json_after
        - blocking_reason_id
        - moderator_id
        - moderator_comment
        - date_created
        - date_updated
        - date_moderation
      title: ProductModerationCard
    ProductModerationPaginatedResult:
      properties:
        limit:
          type: integer
          title: Limit
        page:
          type: integer
          title: Page
        total_pages:
          type: integer
          title: Total Pages
        total_items:
          type: integer
          title: Total Items
        data:
          items:
            $ref: '#/components/schemas/ProductModerationCard'
          type: array
          title: Data
      type: object
      required:
        - limit
        - page
        - total_pages
        - total_items
        - data
      title: ProductModerationPaginatedResult
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          title: Refresh Token
      type: object
      required:
        - refresh_token
      title: RefreshRequest
    TokenPairResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: Bearer
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      title: TokenPairResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
